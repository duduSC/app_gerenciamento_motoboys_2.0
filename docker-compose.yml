version: '3.8'

services:
  # Serviço do Banco de Dados (PostgreSQL)
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  # Serviço do Backend (Sua API Quarkus)
  backend:
    build:
      context: C:\Users\duduc\trabalho_jakarta2\ads175-26pl1-trabalho-final-duduSC
      dockerfile: Dockerfile
    container_name: quarkus_api
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=password
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/mydatabase
    depends_on:
      - db
    networks:
      - app-network

  # Serviço do Frontend (Flutter Web servido pelo Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flutter_nginx
    ports:
      - "80:80" # Expõe o Nginx na porta 80, a porta padrão HTTP
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
